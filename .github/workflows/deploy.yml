name: CI/CD for Salon SaaS Backend

on:
  push:
    branches: [ main ] # Runs every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t abhisek/salon-mgt-api:latest .
          docker push abhisek/salon-mgt-api:latest

      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull the new image
            docker pull abhisek/salon-mgt-api:latest
            
            # Stop and remove the old container
            docker stop salon-mgt-app || true
            docker rm salon-mgt-app || true
            
            # Run the new container using your .env file
            docker run -d \
              --name salon-mgt-app \
              --network spring-network \
              -p 8081:8080 \
              --env-file ~/salon-mgt.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              --restart always \
              abhisek/salon-mgt-api:latest
